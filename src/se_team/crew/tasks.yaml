orchestrator_spec_task:
  description: >
    Analyze the core product vision, problem statement, and domain requirements:
    "{project_brief}"

    IMPORTANT INSTRUCTION:
    Do NOT simply copy or replicate an old legacy application or mobile screen templates.
    Instead, use the core concept—a proactive workplace mental wellness and team burnout tracking platform—to
    innovate and architect a fresh, modern, full-stack web application designed from the ground up.

    Formulate a comprehensive SpecPackage containing:
    1. Clear task scope and verifiable acceptance criteria covering:
       - Dual-role team dynamic:
         * Team Manager: Sets up a team with a shareable team code, monitors overall team wellness trends, and views burnout risk indicators without invasive surveillance.
         * Team Member: Joins team via team code, completes baseline lifestyle/wellness profile, logs daily emotional & activity pulses, takes tiered burnout assessments, and views personal analytics.
       - Low-friction daily wellness pulse (mood ratings, contextual activity/reflection, idempotent daily logging).
       - Visual wellness timeline / calendar view for tracking individual mood trends over time.
       - Evidence-based burnout assessment engine (e.g. multi-stage screening + Maslach Burnout dimensions: Emotional Exhaustion, Depersonalization/Cynicism, Personal Accomplishment with proper reverse-scoring) mapped to clear risk levels.
       - Manager team wellness radar (visual indicators, stress distribution, actionable team health insights).
       - Actionable coping strategies and wellness recovery resources.
    2. Elegant SQLite database schema (Users with roles, Teams, MoodLogs with idempotency, BurnoutAssessments with subscale scores).
    3. Comprehensive REST API contract (Endpoints, methods, payload schemas, status codes).
    4. Creative instructions for Frontend Specialist (modern single-page web app, soothing visual design, role-based dashboards, interactive charts/calendar).
    5. Robust instructions for Backend Specialist (FastAPI endpoints, business logic, scoring formulas, data persistence, CORS).
    6. QA verification guidance (scoring formulas, threshold boundary checks, edge cases, idempotency).
  expected_output: >
    A fully populated SpecPackage Pydantic structure defining a fresh, modern architecture for the wellness platform.

frontend_build_task:
  description: >
    Build a fresh, modern frontend web application based on the SpecPackage API contract and frontend instructions:
    {frontend_instructions}

    API Contract Summary:
    {api_contract_summary}

    Use your write_file tool to create the files under frontend/ (e.g. frontend/index.html, frontend/app.js, frontend/styles.css).
    Requirements:
    - Pure HTML5, CSS3, and modern vanilla JavaScript. No external bundlers or build steps required.
    - Original, modern, and empathetic UI/UX:
      * Welcoming landing/auth gate with intuitive role selection (Manager vs Member).
      * Member Wellness Hub:
        - Quick daily mood & energy check-in with contextual notes and date selection (restricting future dates).
        - Visual wellness calendar / timeline highlighting emotional trends over time, with an inspector modal to review past entries.
        - Personal analytics view (visual mood breakdown, baseline health habits).
        - Interactive burnout self-assessment flow presenting clear, supportive feedback and risk levels.
        - Coping tips library with practical wellness and stress-management strategies.
      * Team Manager Dashboard:
        - Team overview with shareable team access code.
        - Team wellness radar / roster showing aggregated member burnout indicators (e.g., visual risk levels/flames).
        - Drill-down insights into subscale dimensions to help managers provide targeted, supportive interventions.
    - Code against the API contract endpoints exactly.
    - Provide smooth user feedback (loading states, success notifications, validation alerts).
    - Responsive, clean, and accessible CSS styling that looks great on both desktop and mobile viewports.
  expected_output: >
    Modern frontend application code written to workspace/frontend/ directory.

backend_build_task:
  description: >
    Build a robust backend REST API and data layer based on the SpecPackage API contract, data schema, and instructions:
    {backend_instructions}

    API Contract Summary:
    {api_contract_summary}
    Data Schema Summary:
    {data_schema_summary}

    Use your write_file tool to create the backend under backend/ (e.g. backend/main.py, backend/database.py, backend/models.py, backend/scoring.py).
    Requirements:
    - FastAPI framework with SQLite database.
    - Implement all domain entities: Users (roles, baseline health), Teams (team code, manager), DailyMoodLogs (idempotent per user and date), and BurnoutAssessments (subscale scores, risk levels).
    - Implement all required endpoints:
      * Authentication, team creation with unique code generation, and team joining.
      * Daily mood logging with idempotent update-or-insert behavior.
      * Monthly mood history / calendar retrieval.
      * Burnout assessment evaluation engine implementing clinical scoring formulas (including proper reverse-scoring on applicable subscales) and risk classification.
      * Manager team overview and aggregated risk analytics.
      * Coping tips and educational resources.
    - Proper input validation via Pydantic and clean HTTP status codes (200, 201, 400, 404, 422).
    - CORS middleware enabled for seamless frontend communication.
    - Safe parameterized queries to ensure database security.
  expected_output: >
    FastAPI backend code with SQLite database written to workspace/backend/ directory.

qa_verification_task:
  description: >
    Verify the backend implementation, calculation logic, and API contracts using your run_tests tool:
    Guidance: {qa_guidance}
    API Contract: {api_contract_summary}

    Requirements:
    - Author and execute comprehensive pytest test suites inside the workspace verifying:
      * Burnout scoring logic: subscale calculation correctness, reverse-scoring mechanisms, boundary values (all zeros, maximum scores), and composite risk tier triggers.
      * Idempotent daily mood logging: submitting multiple entries on the same date for a user correctly updates the record rather than duplicating it.
      * Team code validation: joining with invalid or non-existent team codes fails gracefully; valid codes pair correctly.
      * Role-based permissions: members and managers access their appropriate data views.
      * Input validation: invalid formats, out-of-range values, and bad requests return proper 400/422 status codes.
    - Use the run_tests tool to execute real pytest tests inside the workspace.
    - Produce a detailed QAReport documenting test results, passed/failed counts, raw test outputs,
      and any bugs found with severity, edge case category, and owning agent (frontend, backend, or both).
  expected_output: >
    A complete QAReport Pydantic structure reflecting real pytest execution results.

orchestrator_reprompt_task:
  description: >
    QA verification reported failures or bugs in round {round_number}:
    {qa_report_summary}

    Bugs found:
    {bugs_list}

    Formulate revised, targeted instructions ONLY for the agents that own the defects ({owning_agents}).
    Do not instruct agents that do not have bugs assigned to them. Focus specifically on scoring accuracy,
    data persistence, API contract compliance, or UI issues.
  expected_output: >
    A RePromptPackage Pydantic structure containing targeted fixes for owning agents.

orchestrator_signoff_task:
  description: >
    QA verification passed in round {round_number}:
    {qa_report_summary}

    Perform final review against the product concept and acceptance criteria, and provide official sign-off.
  expected_output: >
    A FinalSignOff Pydantic structure confirming delivery readiness.
